<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PV Energiefluss</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:system-ui,sans-serif;background:#101c2b;color:#e8f0f7}body{padding:clamp(8px,2vmin,20px);display:flex;flex-direction:column}header{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:clamp(11px,2.5vmin,16px)}small{color:#9db0c3}main{flex:1;min-height:0;display:grid;place-items:center}svg.flow{width:100%;height:100%;min-height:220px} .wire{fill:none;stroke:#34475c;stroke-width:3}.active{stroke-dasharray:5 13;stroke-linecap:round;animation:flow 1.4s linear infinite;stroke-width:4}.reverse{animation-direction:reverse}@keyframes flow{to{stroke-dashoffset:-36}}.node rect{fill:#1c2d40;stroke:#3b526a;stroke-width:1}.node{cursor:pointer;outline:none}.node:focus rect,.node:hover rect{stroke:#d5e7fa;stroke-width:2}text{fill:#e8f0f7;text-anchor:middle;font-size:16px}.label{fill:#9db0c3;font-size:12px}.value{font-size:23px;font-weight:650}.sub{font-size:11px;fill:#9db0c3}.icon{font-size:23px}footer{font-size:11px;color:#9db0c3;text-align:center}dialog{background:#15263a;color:#e8f0f7;border:1px solid #52687c;border-radius:14px;width:95%;max-width:760px;padding:18px}dialog::backdrop{background:#0009}button{background:#2a435c;color:white;border:0;border-radius:8px;padding:9px 14px;cursor:pointer}#chart{width:100%;height:200px}#chart polyline{fill:none;stroke:#5cddc4;stroke-width:2}#chart text{font-size:11px}#chart line{stroke:#71869b}#message{color:#b5c7d8;font-size:13px}@media(prefers-reduced-motion:reduce){.active{animation:none}} 
</style>
<header><strong>ENERGIE · LIVE</strong><small id="updated"></small></header><main><svg class="flow" viewBox="0 0 600 360" preserveAspectRatio="xMidYMid meet" aria-label="Energieflüsse">
<path class="wire" d="M300 100 V150"/><path id="pvLine" d="M300 100 V150"/>
<path class="wire" d="M165 200 H235"/><path id="batteryLine" d="M165 200 H235"/>
<path class="wire" d="M435 200 H365"/><path id="gridLine" d="M435 200 H365"/>
<path class="wire" d="M300 250 V280"/><path id="evLine" d="M300 250 V280"/>
<g id="pv" class="node" role="button" tabindex="0" transform="translate(225 10)"><rect width="150" height="90" rx="16"/><text x="75" y="23" class="label">☀ PV-Erzeugung</text><text x="75" y="54" class="value"></text><text x="75" y="76" class="sub"></text></g>
<g id="battery" class="node" role="button" tabindex="0" transform="translate(10 150)"><rect width="155" height="100" rx="16"/><text x="77" y="23" class="label">▣ Speicher</text><text x="77" y="54" class="value"></text><text x="77" y="79" class="sub"></text></g>
<g id="house" transform="translate(235 150)"><rect width="130" height="100" rx="22" fill="#243d50"/><text x="65" y="24" class="label">⌂ Haus*</text><text x="65" y="56" class="value"></text><text x="65" y="80" class="sub">ohne Wallbox</text></g>
<g id="grid" class="node" role="button" tabindex="0" transform="translate(435 150)"><rect width="155" height="100" rx="16"/><text x="77" y="23" class="label">⚡ Stromnetz</text><text x="77" y="54" class="value"></text><text x="77" y="79" class="sub"></text></g>
<g id="ev" class="node" role="button" tabindex="0" transform="translate(225 280)"><rect width="150" height="78" rx="16"/><text x="75" y="21" class="label">▰ Wallbox</text><text x="75" y="49" class="value"></text><text x="75" y="68" class="sub"></text></g>
</svg></main><footer id="foot">Wert antippen: Verlauf · * Haus aus Leistungsbilanz berechnet</footer>
<dialog><div style="display:flex;justify-content:space-between;align-items:center"><strong id="title"></strong><button id="close" aria-label="Diagramm schließen">Schließen</button></div><p id="message"></p><svg id="chart" viewBox="0 0 640 220" role="img" aria-label="Stundenmittel der letzten 24 Stunden"></svg><div id="extra"></div></dialog>
<script>
const data=/*__DATA__*/null;
const v=data?.values||{};
const format=(x,unit='W')=>x==null?'—':unit==='W'?(Math.abs(x)>=1000?(Math.abs(x)/1000).toLocaleString('de-DE',{maximumFractionDigits:2})+' kW':Math.round(Math.abs(x))+' W'):Math.round(x)+' %';
const value=k=>v[k]?.value??null;
const set=(k,cls,t)=>document.querySelector('#'+k+' .'+cls).textContent=t;
function line(k,power,reverse,color){const el=document.getElementById(k+'Line');el.setAttribute('class',power!=null&&Math.abs(power)>30?'active'+(reverse?' reverse':''):'');el.style.stroke=power!=null&&Math.abs(power)>30?color:'none';}
for(const k of ['pv','battery','grid','ev'])set(k,'value',format(value(k)));
set('battery','sub',(value('battery')==null?'Wert fehlt':value('battery')>30?'Laden':value('battery')< -30?'Entladen':'Bereit')+' · '+format(value('soc'),'%'));
set('grid','sub',value('grid')==null?'Wert fehlt':value('grid')< -30?'Einspeisung':value('grid')>30?'Bezug':'Ausgeglichen');
set('pv','sub','Erzeugung');set('ev','sub','Fahrzeug · '+format(value('car'),'%'));
const balance=['pv','battery','grid','ev'].every(k=>value(k)!=null)?value('pv')+value('grid')-value('battery')-value('ev'):null;
set('house','value',balance!=null&&balance>=-50?format(Math.max(0,balance)):'—');
if(balance!=null&&balance< -50)document.getElementById('foot').textContent='Bilanz unplausibel: Einheiten, Vorzeichen und PV-Quelle prüfen';
line('pv',value('pv'),false,'#f4cd62');line('battery',value('battery'),value('battery')>0,'#5cddc4');line('grid',value('grid'),value('grid')<0,'#80baff');line('ev',value('ev'),false,'#c6a0ff');
document.getElementById('updated').textContent=data?'Stand '+new Date(data.updated*1000).toLocaleTimeString('de-DE'):'Keine Daten';
const modal=document.querySelector('dialog');document.getElementById('close').onclick=()=>modal.close();
function chart(k){const entry=v[k];if(!entry)return;document.getElementById('title').textContent=entry.label+' · letzte 24 Stunden';const rows=entry.history||[];document.getElementById('message').textContent=entry.error||(!entry.archive?'Archivierung nicht aktiv':!rows.length?'Keine Archivwerte in den letzten 24 Stunden':'Stundenmittel · Lücken werden nicht verbunden · Vorzeichen wie Datenquelle');const svg=document.getElementById('chart');svg.replaceChildren();if(rows.length){const lo=Math.min(0,...rows.map(p=>p.v)),hi=Math.max(1,...rows.map(p=>p.v));const start=data.updated-86400,end=data.updated;const x=t=>55+(t-start)/(end-start)*570,y=n=>180-(n-lo)/(hi-lo)*155;const ns='http://www.w3.org/2000/svg';function add(tag,attrs,text){const e=document.createElementNS(ns,tag);for(const [a,b]of Object.entries(attrs))e.setAttribute(a,b);if(text)e.textContent=text;svg.append(e);}add('line',{x1:55,y1:y(0),x2:625,y2:y(0)});for(const n of [lo,hi])add('text',{x:35,y:y(n)+4},Math.round(n).toLocaleString('de-DE'));let segment=[];function flush(){if(segment.length) add('polyline',{points:segment.map(p=>x(p.t)+','+y(p.v)).join(' ')});segment=[];}for(const p of rows){if(segment.length&&p.t-segment.at(-1).t>5400)flush();segment.push(p);add('circle',{cx:x(p.t),cy:y(p.v),r:2,fill:'#5cddc4'});}flush();for(const t of [start,(start+end)/2,end])add('text',{x:x(t),y:208},new Date(t*1000).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}));}svg.style.display=rows.length?'block':'none';const extra=document.getElementById('extra');extra.replaceChildren();const secondary=k==='battery'?'soc':k==='ev'?'car':null;if(secondary){const b=document.createElement('button');b.textContent=v[secondary].label+' anzeigen';b.onclick=()=>chart(secondary);extra.append(b);}if(!modal.open)modal.showModal();}
for(const k of ['pv','battery','grid','ev']){const el=document.getElementById(k);el.onclick=()=>chart(k);el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();chart(k);}};}
</script></html>
