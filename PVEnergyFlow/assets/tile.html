<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:system-ui,sans-serif;color:#e6eff9;background:#091321}body{padding:clamp(6px,2vmin,18px);display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% 45%,#193549 0%,#101e30 46%,#091321 100%)}header{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:clamp(10px,2.3vmin,15px);letter-spacing:.12em}header strong:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#64e3b5;box-shadow:0 0 10px #64e3b5;margin-right:9px}small{color:#93a9c0;letter-spacing:0;font-size:.8em}main{flex:1;min-height:0;display:grid;place-items:center}svg.flow{width:100%;height:100%;min-height:250px}.wire{fill:none;stroke:#2b4055;stroke-width:2}.active{fill:none;stroke-dasharray:3 14;stroke-linecap:round;animation:flow 1.4s linear infinite;stroke-width:4;filter:drop-shadow(0 0 3px currentColor)}.reverse{animation-direction:reverse}@keyframes flow{to{stroke-dashoffset:-34}}.panel{fill:url(#panel);stroke:#3b536b;stroke-width:1;filter:drop-shadow(0 7px 9px #02081266)}.edge{fill:none;stroke:url(#edge);stroke-width:1;pointer-events:none}.detail-divider{stroke:#7894ae;stroke-opacity:.16;stroke-width:1}.accent{fill:currentColor;opacity:.75}.port{fill:#172d40;stroke:#6b879e;stroke-width:1}.icon-bed{fill:currentColor;opacity:.065}.icon .surface{fill:currentColor;fill-opacity:.14}.icon .solid{fill:currentColor;stroke:none}.icon .glass{fill:#83cfff;fill-opacity:.2;stroke:#9ad9ff;stroke-width:1}.icon .fine{stroke-width:.8;opacity:.65}.icon .shadow{fill:#010917;fill-opacity:.4;stroke:none}.node{cursor:pointer;outline:none}.node:focus .panel,.node:hover .panel{stroke:#d8eaff;stroke-width:2}.icon{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.sun{color:#f2ca69}.mint{color:#60dcbd}.blue{color:#88baff}.violet{color:#bd9bf6}text{fill:#e8f0f7;text-anchor:middle;font-size:16px}.label{fill:#a7bed4;font-size:12px;letter-spacing:1.5px}.value{font-size:29px;font-weight:650;letter-spacing:-.5px}.sub{font-size:12px;fill:#a7bed4}.metric{font-size:12px;fill:#d8e5f2;cursor:pointer}.metric:hover{text-decoration:underline}.track{fill:#34485d}.fill{fill:#60dcbd}footer{font-size:10px;color:#8ea6be;text-align:center}dialog{background:#132439;color:#e8f0f7;border:1px solid #52687c;border-radius:18px;width:95%;max-width:760px;padding:18px;box-shadow:0 24px 80px #0008}dialog::backdrop{background:#050b16bf}button{background:#2a435c;color:white;border:0;border-radius:8px;padding:9px 14px;cursor:pointer}#chart{width:100%;height:200px}#chart polyline{fill:none;stroke:#5cddc4;stroke-width:2}#chart text{font-size:11px}#chart line{stroke:#71869b}#message{color:#b5c7d8;font-size:13px}@media(prefers-reduced-motion:reduce){.active{animation:none}}

.details{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;max-height:28vh;overflow:auto;margin:8px 0;flex-shrink:0}.reading{min-width:0;text-align:left;border:1px solid #324a61;background:#15283a;padding:9px 11px;border-radius:9px}.reading span{display:block;color:#9fb6cb;font-size:10px;line-height:1.4}.reading strong{display:block;font-size:clamp(12px,2.5vmin,17px);margin-top:3px;color:#e4f0fb}.reading:focus-visible{outline:2px solid #8bbfff}.reading[hidden]{display:none}@media(max-width:480px){.details{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>

<g id="battery" class="node" role="button" aria-label="SPEICHER: Verlauf öffnen" tabindex="0" transform="translate(20 208)"><rect class="panel" width="220" height="174" rx="22"/><rect class="edge" x="3" y="3" width="214" height="168" rx="19"/><path class="accent mint" d="M28 0h48v2H28z"/><rect class="icon-bed mint" x="12" y="9" width="58" height="48" rx="12"/><path class="detail-divider" d="M24 62H196"/><use href="#batteryIcon" class="icon mint" x="12" y="9" width="60" height="47"/><text class="label" x="134.0" y="36">SPEICHER</text><text class="value" x="110.0" y="85"></text><text class="sub" x="110.0" y="107"></text><rect class="track" x="25" y="121" width="170" height="5" rx="2.5"/><rect id="batteryBar" class="fill" x="25" y="121" width="0" height="5" rx="2.5"/><text id="temperature" data-key="temperature" class="metric" x="110" y="151"></text></g>

</svg></main><section class="details" aria-label="Speicher- und Energiedetails"><button class="reading" data-key="batteryAvailable" hidden><span>Speicher verfügbar</span><strong></strong></button><button class="reading" data-key="batteryCapacity" hidden><span>Speicherkapazität</span><strong></strong></button><button class="reading" data-key="batteryHealth" hidden><span>Batteriezustand (SOH)</span><strong></strong></button><button class="reading" data-key="evTotal" hidden><span>Wallbox gesamt</span><strong></strong></button><button class="reading" data-key="pvToday" hidden><span>PV heute</span><strong></strong></button><button class="reading" data-key="importToday" hidden><span>Netzbezug heute</span><strong></strong></button><button class="reading" data-key="exportToday" hidden><span>Einspeisung heute</span><strong></strong></button></section><footer id="foot">Werte antippen für Verlauf · Hausverbrauch aus Leistungsbilanz</footer>
<dialog><div style="display:flex;justify-content:space-between;align-items:center"><strong id="title"></strong><button id="close" aria-label="Diagramm schließen">Schließen</button></div><p id="message"></p><svg id="chart" viewBox="0 0 640 220" role="img" aria-label="Stundenmittel der letzten 24 Stunden"></svg><div id="extra"></div></dialog>
<script>
const data=/*__DATA__*/null;
const v=data?.values||{};
const format=(x,unit='W')=>x==null?'—':unit==='W'?(Math.abs(x)>=1000?(Math.abs(x)/1000).toLocaleString('de-DE',{maximumFractionDigits:2})+' kW':Math.round(Math.abs(x))+' W'):unit==='kWh'?x.toLocaleString('de-DE',{maximumFractionDigits:1})+' kWh':unit==='°C'?x.toLocaleString('de-DE',{maximumFractionDigits:1})+' °C':Math.round(x)+' %';
const value=k=>v[k]?.value??null;
const set=(k,cls,t)=>document.querySelector('#'+k+' .'+cls).textContent=t;
function line(k,power,reverse,color){const el=document.getElementById(k+'Line');el.setAttribute('class',power!=null&&Math.abs(power)>30?'active'+(reverse?' reverse':''):'');el.style.color=color;el.style.stroke=power!=null&&Math.abs(power)>30?color:'none';}
for(const k of ['pv','battery','grid','ev'])set(k,'value',format(value(k)));
set('battery','sub',(value('battery')==null?'Wert fehlt':value('battery')>30?'Laden':value('battery')< -30?'Entladen':'Bereit')+' · '+format(value('soc'),'%'));
set('grid','sub',value('grid')==null?'Wert fehlt':value('grid')< -30?'Einspeisung':value('grid')>30?'Bezug':'Ausgeglichen');
set('pv','sub',value('pv')==null?'Wert fehlt':value('pv')>30?'Solarstrom wird erzeugt':'Keine Erzeugung');set('ev','sub','Fahrzeug · '+format(value('car'),'%'));

for(const [id,key,label,unit] of [
 ['pvTotal','pvTotal','Gesamt','kWh'],['temperature','temperature','Temperatur','°C'],
 ['gridImport','gridImport','Bezug gesamt','kWh'],['gridExport','gridExport','Einspeisung gesamt','kWh'],
 ['evSession','evSession','Ladezyklus','kWh']
])document.getElementById(id).textContent=label+' · '+format(value(key),unit);
for(const [bar,key] of [['batteryBar','soc'],['carBar','car']])document.getElementById(bar).setAttribute('width',Math.max(0,Math.min(100,value(key)||0))*1.7);

const balance=['pv','battery','grid','ev'].every(k=>value(k)!=null)?value('pv')+value('grid')-value('battery')-value('ev'):null;
set('house','value',balance!=null&&balance>=-50?format(Math.max(0,balance)):'—');
if(balance!=null&&balance< -50)document.getElementById('foot').textContent='Bilanz unplausibel: Einheiten, Vorzeichen und PV-Quelle prüfen';
line('pv',value('pv'),false,'#f4cd62');line('battery',value('battery'),value('battery')>0,'#5cddc4');line('grid',value('grid'),value('grid')<0,'#80baff');line('ev',value('ev'),false,'#c6a0ff');
document.getElementById('updated').textContent=data?'Stand '+new Date(data.updated*1000).toLocaleTimeString('de-DE'):'Keine Daten';
const modal=document.querySelector('dialog');document.getElementById('close').onclick=()=>modal.close();
function chart(k){const entry=v[k];if(!entry)return;document.getElementById('title').textContent=entry.label+' · letzte 24 Stunden'+(entry.unit?' ('+entry.unit+')':'');const rows=entry.history||[];document.getElementById('message').textContent=entry.error||(!entry.archive?'Archivierung nicht aktiv':!rows.length?'Keine Archivwerte in den letzten 24 Stunden':'Stundenmittel · Lücken werden nicht verbunden · Vorzeichen wie Datenquelle');const svg=document.getElementById('chart');svg.replaceChildren();if(rows.length){const lo=Math.min(0,...rows.map(p=>p.v)),hi=Math.max(1,...rows.map(p=>p.v));const start=data.updated-86400,end=data.updated;const x=t=>55+(t-start)/(end-start)*570,y=n=>180-(n-lo)/(hi-lo)*155;const ns='http://www.w3.org/2000/svg';function add(tag,attrs,text){const e=document.createElementNS(ns,tag);for(const [a,b]of Object.entries(attrs))e.setAttribute(a,b);if(text)e.textContent=text;svg.append(e);}add('line',{x1:55,y1:y(0),x2:625,y2:y(0)});for(const n of [lo,hi])add('text',{x:35,y:y(n)+4},Math.round(n).toLocaleString('de-DE'));let segment=[];function flush(){if(segment.length) add('polyline',{points:segment.map(p=>x(p.t)+','+y(p.v)).join(' ')});segment=[];}for(const p of rows){if(segment.length&&p.t-segment.at(-1).t>5400)flush();segment.push(p);add('circle',{cx:x(p.t),cy:y(p.v),r:2,fill:'#5cddc4'});}flush();for(const t of [start,(start+end)/2,end])add('text',{x:x(t),y:208},new Date(t*1000).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}));}svg.style.display=rows.length?'block':'none';const extra=document.getElementById('extra');extra.replaceChildren();const secondary=k==='battery'?'soc':k==='ev'?'car':null;if(secondary&&v[secondary]){const b=document.createElement('button');b.textContent=v[secondary].label+' anzeigen';b.onclick=()=>chart(secondary);extra.append(b);}if(!modal.open)modal.showModal();}
for(const metric of document.querySelectorAll('.reading')) {
 const entry=v[metric.dataset.key];
 metric.hidden=!entry||entry.id===0;
 if(entry)metric.querySelector('strong').textContent=format(entry.value,entry.unit);
}
for(const metric of document.querySelectorAll('[data-key]')){metric.setAttribute('role','button');metric.setAttribute('tabindex','0');metric.onclick=e=>{e.stopPropagation();chart(metric.dataset.key);};metric.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();e.stopPropagation();chart(metric.dataset.key);}};}
for(const k of ['pv','battery','grid','ev']){const el=document.getElementById(k);el.onclick=()=>chart(k);el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();chart(k);}};}
</script></html>
