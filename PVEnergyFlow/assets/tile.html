*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:system-ui,sans-serif;color:#e6eff9;background:#091321}body{padding:clamp(6px,2vmin,18px);display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% 45%,#193549 0%,#101e30 46%,#091321 100%)}header{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:clamp(10px,2.3vmin,15px);letter-spacing:.12em}header strong:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#64e3b5;box-shadow:0 0 10px #64e3b5;margin-right:9px}small{color:#93a9c0;letter-spacing:0;font-size:.8em}main{flex:1;min-height:0;display:grid;place-items:center}svg.flow{width:100%;height:100%;min-height:250px}.wire{fill:none;stroke:#2b4055;stroke-width:2}.active{fill:none;stroke-dasharray:5 15;stroke-linecap:round;stroke-width:4;filter:drop-shadow(0 0 3px currentColor)}.panel{fill:url(#panel);stroke:#3b536b;stroke-width:1;filter:drop-shadow(0 7px 9px #02081266)}.edge{fill:none;stroke:url(#edge);stroke-width:1;pointer-events:none}.detail-divider{stroke:#7894ae;stroke-opacity:.16;stroke-width:1}.accent{fill:currentColor;opacity:.75}.port{fill:#172d40;stroke:#6b879e;stroke-width:1}.icon-bed{fill:currentColor;opacity:.065}.icon .surface{fill:currentColor;fill-opacity:.14}.icon .solid{fill:currentColor;stroke:none}.icon .glass{fill:#83cfff;fill-opacity:.2;stroke:#9ad9ff;stroke-width:1}.icon .fine{stroke-width:.8;opacity:.65}.icon .shadow{fill:#010917;fill-opacity:.4;stroke:none}.node{cursor:pointer;outline:none}.node:focus .panel,.node:hover .panel{stroke:#d8eaff;stroke-width:2}.icon{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.sun{color:#f2ca69}.mint{color:#60dcbd}.blue{color:#88baff}.violet{color:#bd9bf6}text{fill:#e8f0f7;text-anchor:middle;font-size:16px}.label{fill:#a7bed4;font-size:10.5px;letter-spacing:1px}.value{font-size:29px;font-weight:650;letter-spacing:-.5px}.sub{font-size:12px;fill:#a7bed4}.metric{font-size:12px;fill:#d8e5f2;cursor:default}.metric[data-key]{cursor:pointer}.metric[data-key]:hover{text-decoration:underline}.track{fill:#34485d}.fill{fill:#60dcbd}footer{font-size:10px;color:#8ea6be;text-align:center}dialog{background:#132439;color:#e8f0f7;border:1px solid #52687c;border-radius:18px;width:95%;max-width:760px;padding:18px;box-shadow:0 24px 80px #0008}dialog::backdrop{background:#050b16bf}button{background:#2a435c;color:white;border:0;border-radius:8px;padding:9px 14px;cursor:pointer}#chart{width:100%;height:200px}#chart polyline{fill:none;stroke:#5cddc4;stroke-width:2}#chart text{font-size:11px}#chart line{stroke:#71869b}#message{color:#b5c7d8;font-size:13px}

.details{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;max-height:28vh;overflow:auto;margin:8px 0;flex-shrink:0}.reading{min-width:0;text-align:left;border:1px solid #324a61;background:#15283a;padding:9px 11px;border-radius:9px}.reading span{display:block;color:#9fb6cb;font-size:10px;line-height:1.4}.reading strong{display:block;font-size:clamp(12px,2.5vmin,17px);margin-top:3px;color:#e4f0fb}.reading:focus-visible{outline:2px solid #8bbfff}.reading[hidden],.details[hidden]{display:none}@media(max-width:480px){.details{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>

<dialog><div style="display:flex;justify-content:space-between;align-items:center"><strong id="title"></strong><button id="close" aria-label="Diagramm schließen">Schließen</button></div><p id="message"></p><svg id="chart" viewBox="0 0 640 220" role="img" aria-label="Stundenmittel der letzten 24 Stunden"></svg><div id="extra"></div></dialog>
<script>
const data=/*__DATA__*/null;
const v=data?.values||{};
const archiveStamp=()=>data?.archiveUpdated?' · Archivstand '+new Date(data.archiveUpdated*1000).toLocaleTimeString('de-DE'):'';
const format=(x,unit='W')=>x==null?'—':unit==='W'?(Math.abs(x)>=1000?(Math.abs(x)/1000).toLocaleString('de-DE',{maximumFractionDigits:2})+' kW':Math.round(Math.abs(x))+' W'):unit==='kWh'?x.toLocaleString('de-DE',{maximumFractionDigits:2})+' kWh':unit==='°C'?x.toLocaleString('de-DE',{maximumFractionDigits:1})+' °C':Math.round(x)+' %';
const value=k=>v[k]?.value??null;
const set=(k,cls,t)=>document.querySelector('#'+k+' .'+cls).textContent=t;
const animatedFlows=new Map();
function line(k,power,reverse,color) {
 const el=document.getElementById(k+'Line');
 const flowing=power!=null&&(k==='pv'?power>=1:k==='grid'?Math.abs(power)>10:k==='ev'?power>=100:Math.abs(power)>0);
 el.replaceChildren();
 el.setAttribute('class',flowing?'active'+(reverse?' reverse':''):'');
 el.setAttribute('stroke-dashoffset','0');
 el.style.color=color;el.style.stroke=flowing?color:'none';
 if(flowing)animatedFlows.set(el,reverse?1:-1);
 else animatedFlows.delete(el);
}
for(const k of ['pv','battery','grid','ev'])set(k,'value',format(value(k)));
// Fehlende Messwerte bleiben als unbekannt sichtbar, statt als Null zu gelten.
const hidePV=value('pv')!=null&&value('pv')<1;
const hideGrid=value('grid')!=null&&value('grid')>=-10&&value('grid')<=10;
const hideEV=value('ev')!=null&&value('ev')<100;
const hideBattery=value('soc')===0&&value('battery')===0;
for(const [key,hidden] of [['pv',hidePV],['grid',hideGrid],['ev',hideEV],['battery',hideBattery]]) {
 for(const id of [key,key+'Wire',key+'Line',key+'Port'])document.getElementById(id).style.display=hidden?'none':'';
}
set('battery','sub',(value('battery')==null?'Wert fehlt':value('battery')>30?'Laden':value('battery')< -30?'Entladen':'Bereit')+' · '+format(value('soc'),'%'));
set('grid','sub',value('grid')==null?'Wert fehlt':value('grid')< -30?'Einspeisung':value('grid')>30?'Bezug':'Ausgeglichen');
set('pv','sub',value('pv')==null?'Wert fehlt':value('pv')>30?'Solarstrom wird erzeugt':'Keine Erzeugung');set('ev','sub','Fahrzeug · '+format(value('car'),'%'));

for(const [id,key,label,unit] of [
 ['pvTotal','pvTotal','Zählerstand','kWh'],
 ['gridImport','gridImport','Bezug · Zähler','kWh'],['gridExport','gridExport','Einspeisung · Zähler','kWh'],
 ['evSession','evSession','Ladezyklus','kWh']
])document.getElementById(id).textContent=label+' · '+format(value(key),unit);
for(const [bar,key] of [['batteryBar','soc'],['carBar','car']])document.getElementById(bar).setAttribute('width',Math.max(0,Math.min(100,value(key)||0))*1.7);

// Ladeleistung wird vom PHP-Renderer bereits von kW in W umgerechnet.
document.getElementById('chargingInfo').style.display=value('ev')>100?'':'none';
const phases=value('phases');
document.getElementById('evPhases').textContent=(Number.isInteger(phases)&&phases>=0&&phases<=3?phases+'~':'—');
const remaining=value('remaining');
document.getElementById('evRemaining').textContent='Restladezeit · '+(v.remaining?.display ?? (remaining==null?'—':String(remaining)));

const balance=['pv','battery','grid','ev'].every(k=>value(k)!=null)?value('pv')+value('grid')-value('battery')-value('ev'):null;
set('house','value',balance!=null&&balance>=-50?format(Math.max(0,balance)):'—');
if(balance!=null&&balance< -50)document.getElementById('foot').textContent='Bilanz unplausibel: Einheiten, Vorzeichen und PV-Quelle prüfen';
line('pv',value('pv'),false,'#f4cd62');line('battery',value('battery'),value('battery')>0,'#5cddc4');line('grid',value('grid'),value('grid')<0,'#80baff');line('ev',value('ev'),false,'#c6a0ff');
document.getElementById('updated').textContent=data?'Stand '+new Date(data.updated*1000).toLocaleTimeString('de-DE'):'Keine Daten';
const modal=document.querySelector('dialog');document.getElementById('close').onclick=()=>modal.close();
function dailyCounterChart(entry) {
 const svg=document.getElementById('chart');svg.replaceChildren();
 const rows=(entry.history||[]).filter(p=>Number.isFinite(p.v)&&p.v>=0);
 const days=entry.days||[];
 const byDay=new Map(rows.map(p=>[p.day,p.v]));
 const available=days.filter(d=>byDay.has(d.day));
 document.getElementById('title').textContent=entry.label+' · Tageswerte (kWh)';
 document.getElementById('message').textContent=entry.error||(!entry.archive?'Archivierung nicht aktiv':!available.length?'Keine Tageswerte im Archiv vorhanden':'Letzte 7 Kalendertage · Heute vorläufig · Fehlende Tage als — · Zählerstand aktuell: '+format(entry.value,'kWh'))+(!entry.error&&entry.archive?archiveStamp():'');
 document.getElementById('extra').replaceChildren();
 svg.setAttribute('aria-label','Tägliche Energie in kWh, letzte sieben Kalendertage');
 svg.style.display=!entry.error&&available.length?'block':'none';
 if(!entry.error&&available.length){
  const ns='http://www.w3.org/2000/svg';
  function add(tag,attrs,text,parent=svg){const e=document.createElementNS(ns,tag);for(const [a,b]of Object.entries(attrs))e.setAttribute(a,b);if(text)e.textContent=text;parent.append(e);return e;}
  const max=Math.max(1,...available.map(d=>byDay.get(d.day))),step=550/Math.max(1,days.length);
  add('line',{x1:55,y1:180,x2:620,y2:180});
  for(const fraction of [0,.5,1]){
   const y=180-fraction*140;
   if(fraction)add('line',{x1:55,y1:y,x2:620,y2:y,opacity:.2});
   add('text',{x:30,y:y+4},(fraction*max).toLocaleString('de-DE',{maximumFractionDigits:1}));
  }
  days.forEach((day,i)=>{
   const x=62+i*step,center=x+step*.4;
   add('text',{x:center,y:208},day.label+(day.today?'*':''));
   if(!byDay.has(day.day)){add('text',{x:center,y:167},'—');return;}
   const amount=byDay.get(day.day),height=amount/max*140;
   const bar=add('rect',{class:'daily-bar',x:x+4,y:180-height,width:step*.8-8,height,rx:4,fill:day.today?'#84bfff':'#5cddc4'});
   add('title',{},day.label+(day.today?' (heute, vorläufig)':'')+': '+format(amount,'kWh'),bar);
   add('text',{class:'daily-value',x:center,y:Math.max(17,174-height)},amount.toLocaleString('de-DE',{maximumFractionDigits:2}));
  });
 }
 if(!modal.open)modal.showModal();
}
function chart(k) {
 const entry=v[k];if(!entry)return;
 if(entry.kind==='dailyCounter'){dailyCounterChart(entry);return;}
 const counter=entry.kind==='counter'||entry.unit==='kWh';
 const rows=(entry.history||[]).filter(p=>Number.isFinite(p.v)&&Number.isFinite(p.t)).slice().sort((a,b)=>a.t-b.t);
 const reset=counter&&rows.some((p,i)=>i>0&&p.v<rows[i-1].v);
 document.getElementById('title').textContent=entry.label+' · letzte 24 Stunden'+(entry.unit?' ('+entry.unit+')':'');
 let message=entry.error||(!entry.archive?'Archivierung nicht aktiv':!rows.length?'Keine Archivwerte in den letzten 24 Stunden':counter?'Archivierte Zählerstände · kWh':'Stundenmittel · Vorzeichen wie Datenquelle');
 if(counter&&rows.length){
  message+=' · Aktuell: '+format(entry.value,'kWh');
  if(reset)message+=' · Rücksetzung erkannt, Abschnitte getrennt';
  else if(rows.length>1)message+=' · Zuwachs im angezeigten Datenbereich: '+format(rows.at(-1).v-rows[0].v,'kWh');
  if(entry.limited)message+=' · Auf die letzten 2000 Archivwerte begrenzt; Zeitraum möglicherweise unvollständig';
 }
 document.getElementById('message').textContent=message+(!entry.error&&entry.archive?archiveStamp():'');
 const svg=document.getElementById('chart');svg.replaceChildren();
 svg.setAttribute('aria-label',counter?'Archivierte Zählerstände in kWh':'Stundenmittel der letzten 24 Stunden');
 if(rows.length){
  const minimum=Math.min(...rows.map(p=>p.v)),maximum=Math.max(...rows.map(p=>p.v));
  const lo=counter?minimum:Math.min(0,minimum),hi=Math.max(lo+(counter ? 0.01 : 1),maximum);
  const end=data.archiveUpdated??data.updated,start=end-86400;
  const x=t=>65+(t-start)/(end-start)*545,y=n=>180-(n-lo)/(hi-lo)*155;
  const ns='http://www.w3.org/2000/svg';
  function add(tag,attrs,text){const e=document.createElementNS(ns,tag);for(const [a,b]of Object.entries(attrs))e.setAttribute(a,b);if(text)e.textContent=text;svg.append(e);}
  add('line',{x1:65,y1:180,x2:610,y2:180});
  for(const n of [lo,hi])add('text',{x:31,y:y(n)+4},n.toLocaleString('de-DE',{maximumFractionDigits:counter?2:0}));
  let segment=[];
  function flush(){if(segment.length)add('polyline',{points:segment.map(p=>x(p.t)+','+y(p.v)).join(' ')});segment=[];}
  for(const p of rows){
   const previous=segment.at(-1);
   if(previous&&(p.t-previous.t>5400||(counter&&p.v<previous.v)))flush();
   segment.push(p);add('circle',{cx:x(p.t),cy:y(p.v),r:2,fill:'#5cddc4'});
  }
  flush();
  for(const t of [start,(start+end)/2,end])add('text',{x:x(t),y:208},new Date(t*1000).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}));
 }
 svg.style.display=rows.length?'block':'none';
 const extra=document.getElementById('extra');extra.replaceChildren();
 const secondary=k==='battery'?'soc':k==='ev'?'car':null;
 if(secondary&&v[secondary]){const button=document.createElement('button');button.textContent=v[secondary].label+' anzeigen';button.onclick=()=>chart(secondary);extra.append(button);}
 if(!modal.open)modal.showModal();
}
for(const metric of document.querySelectorAll('.reading')) {
 const entry=v[metric.dataset.key];
 metric.hidden=!entry||entry.id===0;
 if(entry)metric.querySelector('strong').textContent=format(entry.value,entry.unit);
}
document.querySelector('.details').hidden=![...document.querySelectorAll('.reading')].some(el=>!el.hidden);
// Phasenanzahl und Restzeit sind reine Statusanzeigen.
for(const metric of document.querySelectorAll('[data-static]')) {
 metric.onclick=e=>e.stopPropagation();
 metric.onkeydown=e=>e.stopPropagation();
}
for(const metric of document.querySelectorAll('[data-key]')){metric.setAttribute('role','button');metric.setAttribute('tabindex','0');metric.onclick=e=>{e.stopPropagation();chart(metric.dataset.key);};metric.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();e.stopPropagation();chart(metric.dataset.key);}};}
for(const k of ['pv','battery','grid','ev']){const el=document.getElementById(k);el.onclick=()=>chart(k);el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();chart(k);}};}
// Direkte Positionsänderung für die WebView der Symcon-App: kein SMIL/CSS nötig.
// Ein gemeinsamer Zeichenzyklus für maximal vier Leitungen, höchstens 30 Bilder/s.
if(animatedFlows.size&&typeof window.requestAnimationFrame==='function') {
 let started=null,lastPaint=-Infinity;
 function animateFlows(timestamp) {
  if(started===null)started=timestamp;
  if(timestamp-lastPaint>=1000/30){
   const phase=((timestamp-started)*40/1200)%40;
   for(const [path,direction] of animatedFlows){
    const offset=String(phase*direction);
    path.setAttribute('stroke-dashoffset',offset);
    path.style.strokeDashoffset=offset;
   }
   lastPaint=timestamp;
  }
  window.requestAnimationFrame(animateFlows);
 }
 window.requestAnimationFrame(animateFlows);
}
</script></html>
