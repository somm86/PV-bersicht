<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PV Energiefluss</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:system-ui,sans-serif;color:#e6eff9;background:#091321}body{padding:clamp(6px,2vmin,18px);display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% 45%,#193549 0%,#101e30 46%,#091321 100%)}header{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:clamp(10px,2.3vmin,15px);letter-spacing:.12em}header strong:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#64e3b5;box-shadow:0 0 10px #64e3b5;margin-right:9px}small{color:#93a9c0;letter-spacing:0;font-size:.8em}main{flex:1;min-height:0;display:grid;place-items:center}svg.flow{width:100%;height:100%;min-height:250px}.wire{fill:none;stroke:#2b4055;stroke-width:2}.active{fill:none;stroke-dasharray:3 14;stroke-linecap:round;animation:flow 1.4s linear infinite;stroke-width:4;filter:drop-shadow(0 0 3px currentColor)}.reverse{animation-direction:reverse}@keyframes flow{to{stroke-dashoffset:-34}}.panel{fill:url(#panel);stroke:#334b63;stroke-width:1}.node{cursor:pointer;outline:none}.node:focus .panel,.node:hover .panel{stroke:#d8eaff;stroke-width:2}.icon{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.sun{color:#f2ca69}.mint{color:#60dcbd}.blue{color:#88baff}.violet{color:#bd9bf6}text{fill:#e8f0f7;text-anchor:middle;font-size:16px}.label{fill:#a7bed4;font-size:12px;letter-spacing:1.5px}.value{font-size:29px;font-weight:650;letter-spacing:-.5px}.sub{font-size:12px;fill:#a7bed4}.metric{font-size:12px;fill:#d8e5f2;cursor:pointer}.metric:hover{text-decoration:underline}.track{fill:#34485d}.fill{fill:#60dcbd}.ring{fill:none;stroke:#5ccfb0;stroke-width:1;opacity:.25}footer{font-size:10px;color:#8ea6be;text-align:center}dialog{background:#132439;color:#e8f0f7;border:1px solid #52687c;border-radius:18px;width:95%;max-width:760px;padding:18px;box-shadow:0 24px 80px #0008}dialog::backdrop{background:#050b16bf}button{background:#2a435c;color:white;border:0;border-radius:8px;padding:9px 14px;cursor:pointer}#chart{width:100%;height:200px}#chart polyline{fill:none;stroke:#5cddc4;stroke-width:2}#chart text{font-size:11px}#chart line{stroke:#71869b}#message{color:#b5c7d8;font-size:13px}@media(prefers-reduced-motion:reduce){.active{animation:none}}
</style>
<header><strong>ENERGIEFLUSS</strong><small id="updated"></small></header><main><svg class="flow" viewBox="0 0 800 610" preserveAspectRatio="xMidYMid meet" aria-label="PV, Speicher, Haus, Stromnetz und Wallbox">
<defs>
<linearGradient id="panel" x2="0" y2="1"><stop stop-color="#20354b"/><stop offset="1" stop-color="#15273b"/></linearGradient>
<symbol id="solarIcon" viewBox="0 0 64 52"><circle cx="48" cy="11" r="6"/><path d="M48 1v2m0 16v2M38 11h-2m24 0h-2M41 4l-2-2m16 16 2 2M55 4l2-2M8 22h39l7 23H2zM20 22l-2 23m15-23 2 23M5 33h45M23 45v6m-10 0h31"/></symbol>
<symbol id="batteryIcon" viewBox="0 0 64 52"><rect x="12" y="7" width="40" height="39" rx="6"/><path d="M25 7V2h14v5M25 22h14m-7-7v14M25 36h14"/></symbol>
<symbol id="gridIcon" viewBox="0 0 64 52"><path d="M30 2h4l13 48M30 2 17 50m6-24h18M20 36h24M26 14h12M18 50h29M13 14h38M9 25h46M14 14v6m36-6v6M10 25v6m44-6v6M24 36l17 14M40 36 23 50"/></symbol>
<symbol id="houseIcon" viewBox="0 0 64 52"><path d="M3 24 32 2l29 22M11 20v30h42V20M26 50V31h13v19M43 10V4h8v12"/><path d="M17 25h6v9h-6zM43 25h5v9h-5z"/></symbol>
<symbol id="evIcon" viewBox="0 0 64 52"><rect x="4" y="3" width="21" height="43" rx="4"/><path d="M9 46v4h-7m11-37h8v12h-8zM25 15h4q4 0 4 5v11q0 5 5 5M39 27l4-10h12l5 10v16H38V27zM38 29h22M42 43v5m14-5v5M43 35h2m9 0h2"/></symbol>
</defs>
<circle class="ring" cx="400" cy="287" r="102"/><circle class="ring" cx="400" cy="287" r="112"/>
<path class="wire" d="M400 158 V220"/><path id="pvLine" d="M400 158 V220"/>
<path class="wire" d="M240 290 H300"/><path id="batteryLine" d="M240 290 H300"/>
<path class="wire" d="M560 290 H500"/><path id="gridLine" d="M560 290 H500"/>
<path class="wire" d="M400 360 V435"/><path id="evLine" d="M400 360 V435"/>
<g id="pv" class="node" role="button" aria-label="PHOTOVOLTAIK: Verlauf öffnen" tabindex="0" transform="translate(290 10)"><rect class="panel" width="220" height="148" rx="22"/><use href="#solarIcon" class="icon sun" x="18" y="14" width="50" height="42"/><text class="label" x="134.0" y="36">PHOTOVOLTAIK</text><text class="value" x="110.0" y="85"></text><text class="sub" x="110.0" y="107"></text><text id="pvTotal" data-key="pvTotal" class="metric" x="110" y="132"></text></g>
<g id="battery" class="node" role="button" aria-label="SPEICHER: Verlauf öffnen" tabindex="0" transform="translate(20 208)"><rect class="panel" width="220" height="174" rx="22"/><use href="#batteryIcon" class="icon mint" x="18" y="14" width="50" height="42"/><text class="label" x="134.0" y="36">SPEICHER</text><text class="value" x="110.0" y="85"></text><text class="sub" x="110.0" y="107"></text><rect class="track" x="25" y="121" width="170" height="5" rx="2.5"/><rect id="batteryBar" class="fill" x="25" y="121" width="0" height="5" rx="2.5"/><text id="temperature" data-key="temperature" class="metric" x="110" y="151"></text></g>
<g id="house" transform="translate(300 220)" role="img" aria-label="Berechneter Hausverbrauch"><rect class="panel" width="200" height="140" rx="32"/><use href="#houseIcon" class="icon mint" x="68" y="15" width="64" height="52"/><text class="value" x="100" y="108"></text></g><g id="grid" class="node" role="button" aria-label="STROMNETZ: Verlauf öffnen" tabindex="0" transform="translate(560 208)"><rect class="panel" width="220" height="174" rx="22"/><use href="#gridIcon" class="icon blue" x="18" y="14" width="50" height="42"/><text class="label" x="134.0" y="36">STROMNETZ</text><text class="value" x="110.0" y="85"></text><text class="sub" x="110.0" y="107"></text><text id="gridImport" data-key="gridImport" class="metric" x="110" y="134"></text><text id="gridExport" data-key="gridExport" class="metric" x="110" y="155"></text></g>
<g id="ev" class="node" role="button" aria-label="WALLBOX: Verlauf öffnen" tabindex="0" transform="translate(290 435)"><rect class="panel" width="220" height="170" rx="22"/><use href="#evIcon" class="icon violet" x="18" y="14" width="50" height="42"/><text class="label" x="134.0" y="36">WALLBOX</text><text class="value" x="110.0" y="85"></text><text class="sub" x="110.0" y="107"></text><rect class="track" x="25" y="119" width="170" height="5" rx="2.5"/><rect id="carBar" class="fill" style="fill:#bd9bf6" x="25" y="119" width="0" height="5" rx="2.5"/><text id="evSession" data-key="evSession" class="metric" x="110" y="150"></text></g>
</svg></main><footer id="foot">Werte antippen für Verlauf · Hausverbrauch aus Leistungsbilanz</footer>
<dialog><div style="display:flex;justify-content:space-between;align-items:center"><strong id="title"></strong><button id="close" aria-label="Diagramm schließen">Schließen</button></div><p id="message"></p><svg id="chart" viewBox="0 0 640 220" role="img" aria-label="Stundenmittel der letzten 24 Stunden"></svg><div id="extra"></div></dialog>
<script>
const data=/*__DATA__*/null;
const v=data?.values||{};
const format=(x,unit='W')=>x==null?'—':unit==='W'?(Math.abs(x)>=1000?(Math.abs(x)/1000).toLocaleString('de-DE',{maximumFractionDigits:2})+' kW':Math.round(Math.abs(x))+' W'):unit==='kWh'?x.toLocaleString('de-DE',{maximumFractionDigits:1})+' kWh':unit==='°C'?x.toLocaleString('de-DE',{maximumFractionDigits:1})+' °C':Math.round(x)+' %';
const value=k=>v[k]?.value??null;
const set=(k,cls,t)=>document.querySelector('#'+k+' .'+cls).textContent=t;
function line(k,power,reverse,color){const el=document.getElementById(k+'Line');el.setAttribute('class',power!=null&&Math.abs(power)>30?'active'+(reverse?' reverse':''):'');el.style.stroke=power!=null&&Math.abs(power)>30?color:'none';}
for(const k of ['pv','battery','grid','ev'])set(k,'value',format(value(k)));
set('battery','sub',(value('battery')==null?'Wert fehlt':value('battery')>30?'Laden':value('battery')< -30?'Entladen':'Bereit')+' · '+format(value('soc'),'%'));
set('grid','sub',value('grid')==null?'Wert fehlt':value('grid')< -30?'Einspeisung':value('grid')>30?'Bezug':'Ausgeglichen');
set('pv','sub',value('pv')==null?'Wert fehlt':value('pv')>30?'Solarstrom wird erzeugt':'Keine Erzeugung');set('ev','sub','Fahrzeug · '+format(value('car'),'%'));

for(const [id,key,label,unit] of [
 ['pvTotal','pvTotal','Gesamt','kWh'],['temperature','temperature','Temperatur','°C'],
 ['gridImport','gridImport','Bezug gesamt','kWh'],['gridExport','gridExport','Einspeisung gesamt','kWh'],
 ['evSession','evSession','Ladezyklus','kWh']
])document.getElementById(id).textContent=label+' · '+format(value(key),unit);
for(const [bar,key] of [['batteryBar','soc'],['carBar','car']])document.getElementById(bar).setAttribute('width',Math.max(0,Math.min(100,value(key)||0))*1.7);

const balance=['pv','battery','grid','ev'].every(k=>value(k)!=null)?value('pv')+value('grid')-value('battery')-value('ev'):null;
set('house','value',balance!=null&&balance>=-50?format(Math.max(0,balance)):'—');
if(balance!=null&&balance< -50)document.getElementById('foot').textContent='Bilanz unplausibel: Einheiten, Vorzeichen und PV-Quelle prüfen';
line('pv',value('pv'),false,'#f4cd62');line('battery',value('battery'),value('battery')>0,'#5cddc4');line('grid',value('grid'),value('grid')<0,'#80baff');line('ev',value('ev'),false,'#c6a0ff');
document.getElementById('updated').textContent=data?'Stand '+new Date(data.updated*1000).toLocaleTimeString('de-DE'):'Keine Daten';
const modal=document.querySelector('dialog');document.getElementById('close').onclick=()=>modal.close();
function chart(k){const entry=v[k];if(!entry)return;document.getElementById('title').textContent=entry.label+' · letzte 24 Stunden'+(entry.unit?' ('+entry.unit+')':'');const rows=entry.history||[];document.getElementById('message').textContent=entry.error||(!entry.archive?'Archivierung nicht aktiv':!rows.length?'Keine Archivwerte in den letzten 24 Stunden':'Stundenmittel · Lücken werden nicht verbunden · Vorzeichen wie Datenquelle');const svg=document.getElementById('chart');svg.replaceChildren();if(rows.length){const lo=Math.min(0,...rows.map(p=>p.v)),hi=Math.max(1,...rows.map(p=>p.v));const start=data.updated-86400,end=data.updated;const x=t=>55+(t-start)/(end-start)*570,y=n=>180-(n-lo)/(hi-lo)*155;const ns='http://www.w3.org/2000/svg';function add(tag,attrs,text){const e=document.createElementNS(ns,tag);for(const [a,b]of Object.entries(attrs))e.setAttribute(a,b);if(text)e.textContent=text;svg.append(e);}add('line',{x1:55,y1:y(0),x2:625,y2:y(0)});for(const n of [lo,hi])add('text',{x:35,y:y(n)+4},Math.round(n).toLocaleString('de-DE'));let segment=[];function flush(){if(segment.length) add('polyline',{points:segment.map(p=>x(p.t)+','+y(p.v)).join(' ')});segment=[];}for(const p of rows){if(segment.length&&p.t-segment.at(-1).t>5400)flush();segment.push(p);add('circle',{cx:x(p.t),cy:y(p.v),r:2,fill:'#5cddc4'});}flush();for(const t of [start,(start+end)/2,end])add('text',{x:x(t),y:208},new Date(t*1000).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}));}svg.style.display=rows.length?'block':'none';const extra=document.getElementById('extra');extra.replaceChildren();const secondary=k==='battery'?'soc':k==='ev'?'car':null;if(secondary&&v[secondary]){const b=document.createElement('button');b.textContent=v[secondary].label+' anzeigen';b.onclick=()=>chart(secondary);extra.append(b);}if(!modal.open)modal.showModal();}
for(const metric of document.querySelectorAll('[data-key]')){metric.setAttribute('role','button');metric.setAttribute('tabindex','0');metric.onclick=e=>{e.stopPropagation();chart(metric.dataset.key);};metric.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();e.stopPropagation();chart(metric.dataset.key);}};}
for(const k of ['pv','battery','grid','ev']){const el=document.getElementById(k);el.onclick=()=>chart(k);el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();chart(k);}};}
</script></html>
